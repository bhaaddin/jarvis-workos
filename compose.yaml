name: jarvis-workos

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  openclaw-init:
    image: ghcr.io/openclaw/openclaw:2026.9.6@sha256:0a5ff5e682e62afa19149df126aa50063bf65ef885b5c94713ce32dc0eb12e15
    user: "0:0"
    command: ["node", "/bootstrap/seed-openclaw.mjs"]
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./config:/seed-config:ro
      - ./workspace:/seed-workspace:ro
      - ./plugins:/seed-plugins:ro
      - ./scripts:/bootstrap:ro
    logging: *logging

  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.9.6@sha256:0a5ff5e682e62afa19149df126aa50063bf65ef885b5c94713ce32dc0eb12e15
    init: true
    restart: unless-stopped
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Run python scripts/init.py first}
      OLLAMA_API_KEY: ollama-local
      JARVIS_WORKFLOW_TOKEN: ${JARVIS_WORKFLOW_TOKEN:?Run python scripts/init.py first}
      JARVIS_N8N_URL: http://n8n:5678
      JARVIS_PROJECT_TOKEN: ${JARVIS_PROJECT_TOKEN:?Run python scripts/init.py first}
      JARVIS_PROJECT_URL: http://host.docker.internal:18791
      SEARXNG_URL: http://searxng:8080
      TZ: ${TZ:-Etc/UTC}
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - openclaw-data:/home/node/.openclaw
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging: *logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7@sha256:ffeb52485f78b1b06c9a832205853cf75da72a07a514c9a27724df85979d6c34
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      N8N_WEBHOOK_URL: http://localhost:5679/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run python scripts/init.py first}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Etc/UTC}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "127.0.0.1:5679:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./runtime/n8n-bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  ollama:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  searxng:
    image: searxng/searxng@sha256:9b61996edcc679fb6665290f95fda15389a14eda6060e41a25c63ab2758f2436
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    pids_limit: 128
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    environment:
      BASE_URL: http://127.0.0.1:18820/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run python scripts/init.py first}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "127.0.0.1:18820:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  voice:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    profiles: [voice]
    restart: unless-stopped
    environment:
      API_KEY: ${JARVIS_VOICE_TOKEN:?Run python scripts/init.py first}
      ENABLE_UI: "false"
      LOG_LEVEL: info
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "4"
      WHISPER__NUM_WORKERS: "1"
      STT_MODEL_TTL: "-1"
      TTS_MODEL_TTL: "-1"
    ports:
      - "127.0.0.1:18792:8000"
    volumes:
      - voice-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

volumes:
  openclaw-data:
  n8n-data:
  ollama-data:
  voice-models:
